{% load static %}

<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="filterModalLabel">Filtrar Eventos</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form method="get" action="{% url 'eventos_list' %}" id="filterForm">
                <div class="modal-body">
                    <!-- Preserve search query if exists -->
                    {% if request.GET.q %}
                    <input type="hidden" name="q" value="{{ request.GET.q }}">
                    {% endif %}
                    
                    <!-- Keyword search -->
                    <div class="mb-4">
                        <label class="form-label">Palavra-chave</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="fas fa-search text-muted"></i>
                            </span>
                            <input type="text" 
                                   name="keyword" 
                                   class="form-control" 
                                   placeholder="Buscar por palavra-chave..."
                                   value="{{ request.GET.keyword }}">
                        </div>
                    </div>

                    <!-- Period filter -->
                    <div class="mb-4">
                        <label class="form-label">Período</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="period" id="periodAll" value="all" 
                                   {% if not request.GET.period or request.GET.period == 'all' %}checked{% endif %}>
                            <label class="form-check-label" for="periodAll">
                                Todos
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="period" id="periodToday" value="today"
                                   {% if request.GET.period == 'today' %}checked{% endif %}>
                            <label class="form-check-label" for="periodToday">
                                Hoje
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="period" id="periodWeek" value="week"
                                   {% if request.GET.period == 'week' %}checked{% endif %}>
                            <label class="form-check-label" for="periodWeek">
                                Esta semana
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="period" id="periodMonth" value="month"
                                   {% if request.GET.period == 'month' %}checked{% endif %}>
                            <label class="form-check-label" for="periodMonth">
                                Este mês
                            </label>
                        </div>
                    </div>

                    <!-- My events filter -->
                    {% if user.is_authenticated %}
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="my_events" id="myEvents" value="1"
                               {% if request.GET.my_events %}checked{% endif %}>
                        <label class="form-check-label" for="myEvents">
                            Meus eventos
                        </label>
                    </div>
                    {% endif %}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Aplicar Filtros</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.modal-content {
    border-radius: 1rem;
    border: none;
}

.modal-header {
    border-bottom: 1px solid #dee2e6;
    padding: 1rem 1.5rem;
}

.modal-body {
    padding: 1.5rem;
}

.modal-footer {
    border-top: 1px solid #dee2e6;
    padding: 1rem 1.5rem;
}

.form-check {
    margin-bottom: 0.5rem;
}

.btn-primary {
    border-radius: 0.5rem;
    padding: 0.5rem 1.5rem;
}

.btn-secondary {
    border-radius: 0.5rem;
    padding: 0.5rem 1.5rem;
}
</style>
