<!-- Modal Data -->
<div class="custom-modal" id="filtroDataModal">
    <div class="custom-modal-overlay" onclick="closeCustomModal('filtroDataModal')"></div>
    <div class="custom-modal-content">
        <div class="custom-modal-header">
            <div class="custom-modal-title">
                <i class="fas fa-calendar-alt"></i>
                <span>Filtrar por Data</span>
            </div>
            <button type="button" class="custom-modal-close" onclick="closeCustomModal('filtroDataModal')">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="custom-modal-body">
            <div class="date-option">
                <input class="custom-radio" type="radio" name="data" id="dataHoje" value="hoje">
                <label class="custom-radio-label" for="dataHoje">
                    <div class="radio-icon">
                        <i class="fas fa-sun"></i>
                    </div>
                    <div class="radio-content">
                        <span class="radio-title">Hoje</span>
                        <span class="radio-subtitle">Eventos de hoje</span>
                    </div>
                </label>
            </div>
            
            <div class="date-option">
                <input class="custom-radio" type="radio" name="data" id="dataAmanha" value="amanha">
                <label class="custom-radio-label" for="dataAmanha">
                    <div class="radio-icon">
                        <i class="fas fa-calendar-day"></i>
                    </div>
                    <div class="radio-content">
                        <span class="radio-title">Amanhã</span>
                        <span class="radio-subtitle">Eventos de amanhã</span>
                    </div>
                </label>
            </div>
            
            <div class="date-option">
                <input class="custom-radio" type="radio" name="data" id="dataSemana" value="semana">
                <label class="custom-radio-label" for="dataSemana">
                    <div class="radio-icon">
                        <i class="fas fa-calendar-week"></i>
                    </div>
                    <div class="radio-content">
                        <span class="radio-title">Esta Semana</span>
                        <span class="radio-subtitle">Eventos desta semana</span>
                    </div>
                </label>
            </div>
            
            <div class="date-option">
                <input class="custom-radio" type="radio" name="data" id="dataMes" value="mes">
                <label class="custom-radio-label" for="dataMes">
                    <div class="radio-icon">
                        <i class="fas fa-calendar"></i>
                    </div>
                    <div class="radio-content">
                        <span class="radio-title">Este Mês</span>
                        <span class="radio-subtitle">Eventos deste mês</span>
                    </div>
                </label>
            </div>
            
            <div class="date-option">
                <input class="custom-radio" type="radio" name="data" id="dataPersonalizada" value="personalizada">
                <label class="custom-radio-label" for="dataPersonalizada">
                    <div class="radio-icon">
                        <i class="fas fa-calendar-plus"></i>
                    </div>
                    <div class="radio-content">
                        <span class="radio-title">Personalizado</span>
                        <span class="radio-subtitle">Escolha um período específico</span>
                    </div>
                </label>
            </div>
            
            <div class="date-range" id="dateRange" style="display: none;">
                <div class="date-input-group">
                    <div class="date-input-wrapper">
                        <i class="fas fa-calendar-day"></i>
                        <input type="date" class="custom-date-input" id="dataInicio" placeholder="Data Inicial">
                    </div>
                    <div class="date-separator">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                    <div class="date-input-wrapper">
                        <i class="fas fa-calendar-day"></i>
                        <input type="date" class="custom-date-input" id="dataFim" placeholder="Data Final">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="custom-modal-footer">
            <button type="button" class="custom-btn custom-btn-primary" onclick="aplicarFiltro('data')">
                <i class="fas fa-check"></i>
                Aplicar
            </button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const dataPersonalizada = document.getElementById('dataPersonalizada');
    const dateRange = document.getElementById('dateRange');
    const dataRadios = document.querySelectorAll('input[name="data"]');
    
    dataRadios.forEach(radio => {
        radio.addEventListener('change', function() {
            if (this.value === 'personalizada') {
                dateRange.style.display = 'block';
            } else {
                dateRange.style.display = 'none';
            }
        });
    });
});

function openCustomModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
}

function closeCustomModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
    }
}
</script>
