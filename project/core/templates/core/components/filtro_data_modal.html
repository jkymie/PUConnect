<!-- Modal Data -->
<div class="modal fade" id="filtroDataModal" tabindex="-1" aria-labelledby="filtroDataModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="filtroDataModalLabel">Filtrar por Data</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="data" id="dataHoje" value="hoje">
                    <label class="form-check-label" for="dataHoje">Hoje</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="data" id="dataAmanha" value="amanha">
                    <label class="form-check-label" for="dataAmanha">Amanhã</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="data" id="dataSemana" value="semana">
                    <label class="form-check-label" for="dataSemana">Esta Semana</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="data" id="dataMes" value="mes">
                    <label class="form-check-label" for="dataMes">Este Mês</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="data" id="dataPersonalizada" value="personalizada">
                    <label class="form-check-label" for="dataPersonalizada">Personalizado</label>
                </div>
                <div class="date-range mt-3" style="display: none;">
                    <input type="date" class="date-input" id="dataInicio" placeholder="Data Inicial">
                    <input type="date" class="date-input" id="dataFim" placeholder="Data Final">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn-apply" onclick="aplicarFiltro('data')">Aplicar</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const dataPersonalizada = document.getElementById('data-personalizada');
    const dataRadios = document.querySelectorAll('input[name="data"]');
    
    dataRadios.forEach(radio => {
        radio.addEventListener('change', function() {
            if (this.value === 'personalizado') {
                dataPersonalizada.style.display = 'block';
            } else {
                dataPersonalizada.style.display = 'none';
            }
        });
    });
});
</script>

<style>
.modal-title {
    color: white;
}
</style>
