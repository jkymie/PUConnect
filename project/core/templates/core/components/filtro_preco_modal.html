<!-- Modal Preço -->
<div class="modal fade" id="filtroPrecoModal" tabindex="-1" aria-labelledby="filtroPrecoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="filtroPrecoModalLabel">Filtrar por Preço</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="preco" id="precoTodos" value="">
                    <label class="form-check-label" for="precoTodos">Todos</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="preco" id="precoGratuito" value="gratuito">
                    <label class="form-check-label" for="precoGratuito">Gratuito</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="preco" id="precoPago" value="pago">

                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn-apply" onclick="aplicarFiltro('preco')">Aplicar</button>
