<!-- Modal Preço -->
<div class="custom-modal" id="filtroPrecoModal">
    <div class="custom-modal-overlay" onclick="closeCustomModal('filtroPrecoModal')"></div>
    <div class="custom-modal-content">
        <div class="custom-modal-header">
            <div class="custom-modal-title">
                <i class="fas fa-tag"></i>
                <span>Filtrar por Preço</span>
            </div>
            <button type="button" class="custom-modal-close" onclick="closeCustomModal('filtroPrecoModal')">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="custom-modal-body">
            <div class="date-option">
                <input class="custom-radio" type="radio" name="preco" id="precoTodos" value="">
                <label class="custom-radio-label" for="precoTodos">
                    <div class="radio-icon">
                        <i class="fas fa-list"></i>
                    </div>
                    <div class="radio-content">
                        <span class="radio-title">Todos</span>
                        <span class="radio-subtitle">Mostrar todos os preços</span>
                    </div>
                </label>
            </div>
            
            <div class="date-option">
                <input class="custom-radio" type="radio" name="preco" id="precoGratuito" value="gratuito">
                <label class="custom-radio-label" for="precoGratuito">
                    <div class="radio-icon">
                        <i class="fas fa-gift"></i>
                    </div>
                    <div class="radio-content">
                        <span class="radio-title">Gratuito</span>
                        <span class="radio-subtitle">Eventos sem custo</span>
                    </div>
                </label>
            </div>
            
            <div class="date-option">
                <input class="custom-radio" type="radio" name="preco" id="precoPago" value="pago">
                <label class="custom-radio-label" for="precoPago">
                    <div class="radio-icon">
                        <i class="fas fa-credit-card"></i>
                    </div>
                    <div class="radio-content">
                        <span class="radio-title">Pago</span>
                        <span class="radio-subtitle">Eventos com custo</span>
                    </div>
                </label>
            </div>
        </div>
        
        <div class="custom-modal-footer">
            <button type="button" class="custom-btn custom-btn-primary" onclick="aplicarFiltro('preco')">
                <i class="fas fa-check"></i>
                Aplicar
            </button>
        </div>
    </div>
</div>

<style>
.modal-title {
    color: white;
}
</style>
