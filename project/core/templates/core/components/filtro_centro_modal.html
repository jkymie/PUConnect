<!-- Modal Centro -->
<div class="custom-modal" id="filtroCentroModal">
    <div class="custom-modal-overlay" onclick="closeCustomModal('filtroCentroModal')"></div>
    <div class="custom-modal-content">
        <div class="custom-modal-header">
            <div class="custom-modal-title">
                <i class="fas fa-building"></i>
                <span>Filtrar por Centro</span>
            </div>
            <button type="button" class="custom-modal-close" onclick="closeCustomModal('filtroCentroModal')">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="custom-modal-body">
            {% for centro in centros %}
            <div class="date-option">
                <input class="custom-checkbox" type="checkbox" name="centro" id="filtro_centro_{{ centro.codigo }}" value="{{ centro.codigo }}" {% if centro.codigo in current_centros %}checked{% endif %}>
                <label class="custom-radio-label" for="filtro_centro_{{ centro.codigo }}">
                    <div class="radio-icon">
                        {% if centro.codigo == 'ctch' %}
                            <i class="fas fa-church"></i>
                        {% elif centro.codigo == 'css' %}
                            <i class="fas fa-users"></i>
                        {% elif centro.codigo == 'ctc' %}
                            <i class="fas fa-microchip"></i>
                        {% elif centro.codigo == 'ccbs' %}
                            <i class="fas fa-heartbeat"></i>
                        {% else %}
                            <i class="fas fa-building"></i>
                        {% endif %}
                    </div>
                    <div class="radio-content">
                        <span class="radio-title">{{ centro.nome }}</span>
                        <span class="radio-subtitle">{{ centro.codigo|upper }}</span>
                    </div>
                </label>
            </div>
            {% endfor %}
        </div>
        
        <div class="custom-modal-footer">
            <button type="button" class="custom-btn custom-btn-primary" onclick="aplicarFiltro('centro')">
                <i class="fas fa-check"></i>
                Aplicar
            </button>
        </div>
    </div>
</div>

<style>
.modal-title {
    color: white;
}
.date-option input[type="checkbox"].custom-checkbox {
    position: absolute;
    opacity: 0;
    cursor: pointer;
}
.date-option .custom-radio-label {
    display: flex;
    align-items: center;
    width: 100%;
}
.date-option input[type="checkbox"].custom-checkbox:checked + .custom-radio-label {
    background-color: #eef2ff;
    border-color: #4338ca;
}
</style>
