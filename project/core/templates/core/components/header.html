<!-- header.html -->
{% load static %}
<nav style="display:flex;align-items:center;justify-content:space-between;padding:18px 32px 0 32px;background:#fff;box-shadow:none;border-bottom:1px solid #e3edfc;min-height:64px;">
  <a href="{% url 'home' %}" style="font-weight:700;font-size:1.5rem;color:#2563eb;text-decoration:none;letter-spacing:-1px;">PUConnect</a>
  <div style="display:flex;align-items:center;position:relative;">
    <button id="user-icon-btn" style="background:none;border:none;cursor:pointer;padding:0;outline:none;">
      <img src="{% static 'core/icons/pessoinha.png' %}" alt="Usuário" style="width:38px;height:38px;border-radius:50%;background:#e3edfc;padding:7px;">
    </button>
    <div id="user-dropdown" style="display:none;position:absolute;right:0;top:48px;background:#fff;border-radius:12px;box-shadow:0 2px 8px #0002;padding:12px 0;min-width:160px;z-index:10;">
      {% if user.is_authenticated %}
        <a href="{% url 'inscricoes' %}" style="display:block;padding:10px 20px;color:#2563eb;text-decoration:none;">Histórico</a>
        {% if user.tipo_usuario == 'organizador' %}
        <a href="{% url 'meus-eventos' %}" style="display:block;padding:10px 20px;color:#2563eb;text-decoration:none;">Meus Eventos</a>
        {% endif %}
        <a href="{% url 'logout' %}" style="display:block;padding:10px 20px;color:#e53935;text-decoration:none;">Sair</a>
      {% else %}
        <a href="{% url 'login' %}" style="display:block;padding:10px 20px;color:#2563eb;text-decoration:none;">Login</a>
        <a href="{% url 'register' %}" style="display:block;padding:10px 20px;color:#2563eb;text-decoration:none;">Registrar</a>
      {% endif %}
    </div>
  </div>
</nav>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('user-icon-btn');
    var dropdown = document.getElementById('user-dropdown');
    if (btn && dropdown) {
      btn.onclick = function(e) {
        e.stopPropagation();
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
      };
      document.addEventListener('click', function() {
        dropdown.style.display = 'none';
      });
    }
  });
</script>
