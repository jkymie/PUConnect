<!-- header.html -->
{% load static %}
<nav class="navbar">
  <a href="{% url 'index' %}" class="logo">PUConnect</a>
  <div class="nav-links">
    {% if user.is_authenticated %}
      <div class="dropdown" style="position: relative; display: inline-block;">
        <a href="#" class="login" onclick="toggleDropdown(event)">
          <img src="{% static 'core/assets/img/user.png' %}" alt="Menu do usuário" style="width:32px; height:32px; border-radius:50%;" />
        </a>
        <div id="userDropdown" class="dropdown-content" style="display:none; position:absolute; right:0; background:#fff; min-width:180px; box-shadow:0 8px 16px rgba(0,0,0,0.2); z-index:1000; border-radius:8px;">
          <a href="{% url 'preferencias' %}" style="display:block; padding:10px 16px; color:#222; text-decoration:none;">Preferências</a>
          {% if user.tipo_usuario == 'aluno' %}
            <a href="{% url 'meus_eventos_aluno' %}" style="display:block; padding:10px 16px; color:#222; text-decoration:none;">Meus Eventos</a>
          {% elif user.tipo_usuario == 'organizador' %}
            <a href="{% url 'meus_eventos' %}" style="display:block; padding:10px 16px; color:#222; text-decoration:none;">Gerenciar Eventos</a>
          {% endif %}
          <a href="{% url 'logout' %}" style="display:block; padding:10px 16px; color:#c00; text-decoration:none;">Sair</a>
        </div>
      </div>
    {% else %}
      <div class="dropdown" style="position: relative; display: inline-block;">
        <a href="#" class="login" onclick="toggleDropdown(event)">
          <img src="{% static 'core/assets/img/user.png' %}" alt="Logar/Cadastrar" style="width:32px; height:32px; border-radius:50%;" />
        </a>
        <div id="userDropdown" class="dropdown-content" style="display:none; position:absolute; right:0; background:#fff; min-width:180px; box-shadow:0 8px 16px rgba(0,0,0,0.2); z-index:9990; border-radius:8px;">
          <a href="#" onclick="openModal('modal-login'); document.getElementById('userDropdown').style.display='none'; return false;" style="display:block; padding:10px 16px; color:#222; text-decoration:none;">Entrar</a>
          <a href="#" onclick="openModal('modal-register'); document.getElementById('userDropdown').style.display='none'; return false;" style="display:block; padding:10px 16px; color:#222; text-decoration:none;">Registrar</a>
        </div>
      </div>
    {% endif %}
  </div>
</nav>
<script>
function toggleDropdown(event) {
  event.preventDefault();
  event.stopPropagation();
  var dropdown = document.getElementById('userDropdown');
  var isVisible = dropdown.style.display === 'block';
  
  // Close all dropdowns first
  dropdown.style.display = 'none';
  
  // If it was hidden, show it
  if (!isVisible) {
    dropdown.style.display = 'block';
    
    // Add click listener to close dropdown when clicking outside
    setTimeout(function() {
      document.addEventListener('click', function closeDropdown(e) {
        if (!e.target.closest('.dropdown')) {
          dropdown.style.display = 'none';
          document.removeEventListener('click', closeDropdown);
        }
      });
    }, 0);
  }
}

// Close dropdown when clicking outside (global handler)
document.addEventListener('click', function(e) {
  if (!e.target.closest('.dropdown')) {
    var dropdown = document.getElementById('userDropdown');
    if (dropdown) {
      dropdown.style.display = 'none';
    }
  }
});
</script>
