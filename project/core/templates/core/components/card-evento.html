{% load static %}

<div class="evento-card" style="background:#fff;border-radius:16px;box-shadow:0 4px 16px #0002;padding:20px 18px;min-width:300px;max-width:320px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;">
    {% if evento.imagem %}
        <img src="{{ evento.imagem.url }}" alt="{{ evento.titulo }}" style="width:100%;height:120px;object-fit:cover;border-radius:12px;">
    {% else %}
        <div style="width:100%;height:120px;background:#e3edfc;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#2563eb;font-size:2rem;">📅</div>
    {% endif %}
    <div style="font-weight:700;font-size:1.08rem;color:#222;line-height:1.2;">{{ evento.titulo }}</div>
    <div style="color:#666;font-size:0.97rem;display:flex;align-items:center;gap:8px;">
        <img src="{% static 'core/icons/Clock.svg' %}" style="width:18px;vertical-align:middle;"> {{ evento.data_hora|date:"d/m H:i" }}
    </div>
    <div style="color:#2563eb;font-size:0.97rem;display:flex;align-items:center;gap:6px;">
        <img src="{% static 'core/icons/Map_Pin.svg' %}" style="width:18px;vertical-align:middle;"> {{ evento.local }}
    </div>
</div>
