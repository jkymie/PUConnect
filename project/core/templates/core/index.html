  <!-- Página inicial - Apresentação de eventos -->
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUConnect</title>

  <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
  <script defer src="{% static 'core/js/main.js' %}"></script>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>

  <!-- Header dinâmico -->
  {% include 'core/components/header.html' %}
  <div class="all"> 
    <div class="hero-section">
    <!-- Hero/banner -->
    <section class="hero">
        <div class="container-main">
        <h2 class="banner"><b>Participe</b>, <b>descubra</b> e <b>divulgue</b> eventos na PUC-Rio</h2>
          <div class="search-container">
            <img src="{% static 'core/assets/img/Search.svg' %}" alt="Pesquisar" class="search-icon">
            <input type="text" id="searchInput" placeholder="Pesquise por eventos, assuntos, áreas..." />
            <a href="#" id="searchButton">Procurar</a>
          </div>
        </div>
    </section>
    </div>

    <!-- Lista de eventos -->
    <section id="eventos" class="eventos">
        <div class="eventos-container">
          <div class="eventos-titulo">
            <img src="{% static 'core/assets/img/estrelinha.png' %}" alt="Estrela" class="estrela">
            <h3>Eventos em destaque</h3>
          </div>
          <a href="#eventos" class="btn">Ver todos os eventos</a>
        </div>
        <div class="lista-eventos" id="listaEventos">
          <!-- Os eventos serão carregados via JS -->
        </div>
      </section>

      <section id="colecao" class="colecao">
        <div class="colecao-container">
          <div class="colecao-titulo">
            <img src="{% static 'core/assets/img/estrelinha.png' %}" alt="Estrela" class="estrela">
            <h3>Explore nossa coleção</h3>
          </div>
        </div>
        <div class="lista-colecao" id="listaColecao">
          <!-- Os eventos serão carregados via JS -->
        </div>
      </section>

      <section id="eventosMes" class="eventosMes">
        <div class="eventos-container-mes">
          <div class="eventos-titulo-mes">
            <img src="{% static 'core/assets/img/estrelinha.png' %}" alt="Estrela" class="estrela">
            <h3>Eventos desse mês</h3>
          </div>
        </div>
        <div class="lista-eventos" id="listaEventos">
          <!-- Os eventos serão carregados via JS -->
        </div>
      </section>
  </div>
  <!-- Footer dinâmico -->
  {% include 'core/components/footer.html' %}

  <!-- Scripts -->
  <script src="{% static 'core/js/main.js' %}"></script>
  <script src="js/main.js"></script>
  <script src="js/eventos.js"></script>
  <script>
    const container = document.getElementById("event-cards-container");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");

    // Altere a URL abaixo para o endpoint da sua API
    const API_URL = 'https://seuservidor.com/api/eventos';

    fetch(API_URL)
      .then(response => {
        if (!response.ok) {
          throw new Error("Erro na resposta da API");
        }
        return response.json();
      })
      .then(eventos => {
        loading.style.display = 'none';

        if (eventos.length === 0) {
          container.innerHTML = '<p>Nenhum evento encontrado.</p>';
          return;
        }

        eventos.forEach(evento => {
          const card = document.createElement("div");
          card.classList.add("card");
          card.innerHTML = `
            <h3>${evento.nome}</h3>
            <p><strong>Data:</strong> ${evento.data}</p>
            <p><strong>Local:</strong> ${evento.local}</p>
            <a href="evento.html?id=${evento.id}">Ver mais</a>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        console.error(err);
        loading.style.display = 'none';
        error.style.display = 'block';
      });
  </script>
</body>
</html>
